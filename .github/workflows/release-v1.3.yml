name: Release quicknote v1.7

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Toggle quicknote from toolbar for v1.7'
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build macOS app and installer
        run: bash scripts/build-app.sh

      - name: Package ZIP installer
        run: |
          cd dist
          zip -q -j quicknote-installer.zip quicknote-macOS.dmg

      - name: Replace v1.7 installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            '- Matched the floating quicknote to the solid Notepad surface and fixed layout and dragging' \
            '- Made the Notepad toolbar button toggle the floating quicknote' > release-notes.md
          gh release upload 1.7 dist/quicknote-installer.zip --clobber
          gh release edit 1.7 --title "v1.7" --notes-file release-notes.md
