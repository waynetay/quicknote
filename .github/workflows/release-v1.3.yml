name: Release v1.3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release quicknote v1.3'
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build macOS app and installer
        run: bash scripts/build-app.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3 dist/quicknote-macOS.dmg \
            --title "quicknote v1.3" \
            --notes "Quicknote now runs from the menu bar and can open a Quick Note with Option+Q or Notepad with Shift+Option+Q. Includes full-screen Space support and Open at Login."
