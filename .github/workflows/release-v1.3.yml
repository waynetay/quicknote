name: Release quicknote v1.6

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Publish quicknote v1.6'
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build macOS app and installer
        run: bash scripts/build-app.sh

      - name: Package ZIP installer
        run: |
          cd dist
          zip -q -j quicknote-installer.zip quicknote-macOS.dmg

      - name: Publish v1.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            '- Unified the notepad and quicknote window styling' \
            '- Removed the square frame around quicknote' > release-notes.md
          gh release create 1.6 dist/quicknote-installer.zip \
            --title "v1.6" \
            --target "$GITHUB_SHA" \
            --notes-file release-notes.md
