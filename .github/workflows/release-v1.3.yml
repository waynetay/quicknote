name: Release v1.4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release quicknote v1.4'
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build macOS app and installer
        run: bash scripts/build-app.sh

      - name: Package ZIP installer
        run: |
          cd dist
          zip -q -j quicknote-installer.zip quicknote-macOS.dmg

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --force 1.4 "$GITHUB_SHA"
          git push --force origin refs/tags/1.4
          cat > release-notes.md <<'EOF'
          - Polished UI
          - Bug fixes
          EOF
          gh release upload 1.4 dist/quicknote-installer.zip --clobber
          gh release edit 1.4 --title "v1.4" --notes-file release-notes.md
