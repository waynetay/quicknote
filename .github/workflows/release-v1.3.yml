name: Release quicknote v1.7

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Publish quicknote v1.7'
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build macOS app and installer
        run: bash scripts/build-app.sh

      - name: Package ZIP installer
        run: |
          cd dist
          zip -q -j quicknote-installer.zip quicknote-macOS.dmg

      - name: Publish v1.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            '- Added a solid tinted Liquid Glass surface for the floating quicknote' \
            '- Restored dragging from the floating quicknote header' > release-notes.md
          gh release create 1.7 dist/quicknote-installer.zip \
            --title "v1.7" \
            --target "$GITHUB_SHA" \
            --notes-file release-notes.md
