name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Swift
        run: swift --version

      - name: Build app and DMG installer
        run: bash scripts/build-app.sh

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: quicknote-installer
          path: dist/quicknote-macOS.dmg
          if-no-files-found: error
          retention-days: 30
