name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Swift
        run: swift --version

      - name: Build app bundle
        run: bash scripts/build-app.sh

      - name: Package app for download
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/quicknote.app" "dist/quicknote-macOS.zip"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: quicknote-macOS
          path: dist/quicknote-macOS.zip
          if-no-files-found: error
          retention-days: 30
